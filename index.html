<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المشجر العشائري المتكامل - مع رفع وتفريغ الصور</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; }
        body { background: #140d07; color: #fff; padding: 15px; }

        .app-container { display: flex; gap: 15px; max-width: 1700px; margin: 0 auto; flex-wrap: wrap; }

        .sidebar {
            flex: 1; min-width: 340px; background: #23140c; border: 2px solid #5d4037;
            border-radius: 12px; padding: 15px; text-align: right; box-shadow: 0 8px 20px rgba(0,0,0,0.7);
            max-height: 920px; overflow-y: auto;
        }

        .sidebar h2 { font-family: 'Amiri', serif; color: #ffb300; margin-bottom: 12px; border-bottom: 1px solid #4e342e; padding-bottom: 6px; }
        .section-box { background: #321c12; padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #4e342e; }
        .section-box h3 { color: #ffe082; font-size: 14px; margin-bottom: 8px; }

        label { font-size: 12px; color: #d7ccc8; display: block; margin-top: 6px; }
        input[type="text"], input[type="number"], select {
            width: 100%; padding: 7px; margin: 3px 0 6px; border-radius: 5px;
            border: 1px solid #6d4c41; background: #efebe9; color: #23140c; font-weight: bold; font-size: 13px;
        }

        input[type="file"] { font-size: 11px; margin: 4px 0; color: #ffe082; width: 100%; }

        .row-2 { display: flex; gap: 8px; }
        .row-2 div { flex: 1; }

        .checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #ffe082; margin: 6px 0; cursor: pointer; }
        .checkbox-label input { width: 16px; height: 16px; cursor: pointer; }

        button {
            width: 100%; padding: 9px; border: none; border-radius: 6px; font-weight: bold;
            cursor: pointer; transition: 0.2s; margin-top: 5px; font-size: 13px;
        }
        .btn-green { background: #2e7d32; color: white; }
        .btn-gold { background: #ffb300; color: #23140c; }
        .btn-red { background: #c62828; color: white; }
        .btn-blue { background: #1565c0; color: white; }
        .btn-brown { background: #5d4037; color: white; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }

        .canvas-area {
            flex: 3; min-width: 750px; background: #fffdf7; border: 4px solid #5d4037;
            border-radius: 12px; overflow: auto; display: flex; justify-content: center;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.4); position: relative;
        }

        canvas { cursor: pointer; }

        .trunk-list { max-height: 120px; overflow-y: auto; background: #1a0d07; padding: 4px; border-radius: 5px; margin-top: 6px; }
        .trunk-item { display: flex; justify-content: space-between; align-items: center; background: #321c12; padding: 4px 8px; margin: 2px 0; border-radius: 4px; font-size: 12px; }
        .trunk-item button { width: auto; padding: 1px 6px; margin: 0; font-size: 10px; }
    </style>
</head>
<body>

    <h1 style="text-align:center; font-family:'Amiri', serif; color:#ffb300; margin-bottom:12px;">المشجر العشائري المتكامل (رفع وتفريغ صور الجذع والأغصان)</h1>

    <div class="app-container">
        <!-- لوحة التحكم -->
        <div class="sidebar">
            <h2>لوحة التحكم بالصور والعمود</h2>

            <!-- 1. صورة الجذع المخصصة -->
            <div class="section-box">
                <h3>1. صورة جذع الشجرة / النخلة</h3>
                <label>رفع صورة كاملة لجذع النخلة أو الشجرة:</label>
                <input type="file" id="trunkImageUpload" accept="image/*">
                
                <label class="checkbox-label">
                    <input type="checkbox" id="removeTrunkBg" checked>
                    تفريغ الخلفية البيضاء للجذع تلقائياً
                </label>

                <div class="row-2">
                    <div>
                        <label>عرض الجذع:</label>
                        <input type="number" id="trunkWidthInput" value="180">
                    </div>
                    <div>
                        <label>ارتفاع الجذع:</label>
                        <input type="number" id="trunkHeightInput" value="520">
                    </div>
                </div>

                <button class="btn-brown" id="resetTrunkBtn">إلغاء صورة الجذع (رسم جذع افتراضي)</button>
            </div>

            <!-- 2. عمود النسب (الأجداد) -->
            <div class="section-box">
                <h3>2. عمود النسب (أسماء الجذع)</h3>
                <input type="text" id="trunkNameInput" placeholder="اسم جد جديد...">
                <button class="btn-gold" id="addTrunkBtn">+ إضافة جد للعمود</button>
                <div class="trunk-list" id="trunkListContainer"></div>
            </div>

            <!-- 3. تعديل الفرع والورقة -->
            <div class="section-box">
                <h3>3. تعديل الغصن والفرع المحدد</h3>
                <div id="selectedInfo" style="color:#ffe082; font-size:12px; margin-bottom:6px;">اضغط على أي اسم بالشجرة لتحديده</div>
                
                <label>الاسم:</label>
                <input type="text" id="nodeNameInput" placeholder="الاسم...">

                <label>رفع صورة خاصة للغصن/الورقة:</label>
                <input type="file" id="nodeImageUpload" accept="image/*">

                <label class="checkbox-label">
                    <input type="checkbox" id="removeNodeBg" checked>
                    تفريغ الخلفية البيضاء للورقة/الغصن
                </label>

                <div class="row-2">
                    <div>
                        <label>حجم الخط:</label>
                        <input type="number" id="fontSizeInput" value="14" min="10" max="30">
                    </div>
                    <div>
                        <label>لون النص:</label>
                        <input type="color" id="textColorInput" value="#ffffff" style="height:32px;">
                    </div>
                </div>

                <div class="row-2">
                    <div>
                        <label>لون الخلفية:</label>
                        <input type="color" id="bgColorInput" value="#2e7d32" style="height:32px;">
                    </div>
                    <div>
                        <label>لون الإطار:</label>
                        <input type="color" id="borderColorInput" value="#1b5e20" style="height:32px;">
                    </div>
                </div>

                <button class="btn-green" id="addChildBtn">+ إضافة ابن (غصن جديد)</button>
                <button class="btn-blue" id="updateNodeBtn">تحديث هذا الفرع</button>
                <button class="btn-red" id="deleteNodeBtn">حذف هذا الفرع</button>
            </div>

            <!-- 4. التصدير والحفظ -->
            <div class="section-box">
                <h3>4. تصدير وحفظ</h3>
                <button class="btn-gold" id="downloadImgBtn">تنزيل الشجرة كصورة (PNG)</button>
            </div>
        </div>

        <!-- Canvas -->
        <div class="canvas-area">
            <canvas id="treeCanvas" width="1200" height="1400"></canvas>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const defaultTrunk = ['بدري', 'محمد', 'دولة', 'عثمان', 'مصطفى', 'عبدالمولى', 'محمود', 'عبدالرزاق', 'عبدالله'];
            const defaultTree = {
                id: 'root', name: 'عشيرة آل النسب',
                children: [
                    {
                        id: 'b1', name: 'قيس', bgColor: '#8d6e63', textColor: '#ffffff', borderColor: '#3e2723', fontSize: 14,
                        children: [
                            { id: 'l1', name: 'أيمن', bgColor: '#2e7d32', textColor: '#ffffff', borderColor: '#1b5e20', fontSize: 13, children: [] },
                            { id: 'l2', name: 'نبيل', bgColor: '#2e7d32', textColor: '#ffffff', borderColor: '#1b5e20', fontSize: 13, children: [] }
                        ]
                    },
                    {
                        id: 'b2', name: 'أحمد', bgColor: '#8d6e63', textColor: '#ffffff', borderColor: '#3e2723', fontSize: 14,
                        children: [
                            { id: 'l3', name: 'مطاع', bgColor: '#2e7d32', textColor: '#ffffff', borderColor: '#1b5e20', fontSize: 13, children: [] }
                        ]
                    }
                ]
            };

            let trunkChain = [...defaultTrunk];
            let treeData = JSON.parse(JSON.stringify(defaultTree));
            let interactiveNodes = [];
            let selectedNode = null;

            let trunkCustomImage = null;
            let nodeImagesMap = {};

            const canvas = document.getElementById('treeCanvas');
            const ctx = canvas.getContext('2d');

            // دالة آمنة لتفريغ خلفية الصورة البيضاء
            function processUploadedImage(img, shouldRemoveBg, callback) {
                if (!shouldRemoveBg) {
                    callback(img);
                    return;
                }
                try {
                    const tempCanvas = document.createElement('canvas');
                    const tempCtx = tempCanvas.getContext('2d');
                    tempCanvas.width = img.width;
                    tempCanvas.height = img.height;
                    tempCtx.drawImage(img, 0, 0);

                    const imgData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
                    const data = imgData.data;

                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i], g = data[i+1], b = data[i+2];
                        if (r > 210 && g > 210 && b > 210) {
                            data[i + 3] = 0; // جعل درجات الأبيض شفافة
                        }
                    }
                    tempCtx.putImageData(imgData, 0, 0);
                    const processedImg = new Image();
                    processedImg.onload = () => callback(processedImg);
                    processedImg.src = tempCanvas.toDataURL();
                } catch(e) {
                    callback(img);
                }
            }

            function renderAll() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                interactiveNodes = [];

                const startX = canvas.width / 2;
                const startY = canvas.height - 60;

                const customW = parseInt(document.getElementById('trunkWidthInput').value) || 180;
                const customH = parseInt(document.getElementById('trunkHeightInput').value) || 520;
                const trunkHeight = Math.max(customH, trunkChain.length * 45);
                const trunkTopY = startY - trunkHeight;

                drawGrass(startX, startY);

                if (trunkCustomImage) {
                    ctx.drawImage(trunkCustomImage, startX - customW / 2, trunkTopY, customW, trunkHeight);
                } else {
                    drawDefaultTrunk(startX, startY, trunkTopY, customW, 60);
                }

                drawTrunkNames(startX, startY - 40, trunkTopY + 30);

                if (treeData.children && treeData.children.length > 0) {
                    drawBranches(treeData.children, startX, trunkTopY, -Math.PI / 2, 250, 0);
                }

                renderTrunkUI();
            }

            function drawGrass(x, y) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(x, y + 350, 400, Math.PI, 0, false);
                ctx.fillStyle = '#2e7d32';
                ctx.fill();
                ctx.lineWidth = 6;
                ctx.strokeStyle = '#1b5e20';
                ctx.stroke();
                ctx.restore();
            }

            function drawDefaultTrunk(x, bottomY, topY, bottomW, topW) {
                ctx.save();
                let grad = ctx.createLinearGradient(x - bottomW, 0, x + bottomW, 0);
                grad.addColorStop(0, '#2b1810');
                grad.addColorStop(0.3, '#4e342e');
                grad.addColorStop(0.5, '#8d6e63');
                grad.addColorStop(0.7, '#4e342e');
                grad.addColorStop(1, '#2b1810');

                ctx.beginPath();
                ctx.moveTo(x - bottomW / 2, bottomY);
                ctx.bezierCurveTo(x - bottomW / 2 - 20, bottomY - 100, x - topW / 2 - 10, topY + 80, x - topW / 2, topY);
                ctx.lineTo(x + topW / 2, topY);
                ctx.bezierCurveTo(x + topW / 2 + 10, topY + 80, x + bottomW / 2 + 20, bottomY - 100, x + bottomW / 2, bottomY);
                ctx.closePath();

                ctx.fillStyle = grad;
                ctx.fill();
                ctx.strokeStyle = '#1a0c06';
                ctx.lineWidth = 4;
                ctx.stroke();
                ctx.restore();
            }

            function drawTrunkNames(x, startY, endY) {
                if (trunkChain.length === 0) return;
                const step = (startY - endY) / (trunkChain.length - 1 || 1);

                trunkChain.forEach((name, i) => {
                    const curY = startY - (i * step);
                    ctx.beginPath();
                    ctx.ellipse(x, curY, 45, 20, 0, 0, Math.PI * 2);
                    ctx.fillStyle = '#fff8e1';
                    ctx.fill();
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#ffb300';
                    ctx.stroke();

                    ctx.fillStyle = '#3e2723';
                    ctx.font = 'bold 15px Tajawal';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(name, x, curY);
                });
            }

            function drawBranches(nodes, startX, startY, baseAngle, length, depth) {
                const count = nodes.length;
                const spread = Math.PI * 0.75;
                const step = count > 1 ? spread / (count - 1) : 0;
                const startAngle = baseAngle - (spread / 2);

                nodes.forEach((node, idx) => {
                    const angle = count === 1 ? baseAngle : startAngle + (idx * step);
                    const endX = startX + Math.cos(angle) * length;
                    const endY = startY + Math.sin(angle) * length;

                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(startX, startY);
                    const ctrlX = (startX + endX) / 2 + Math.sin(angle) * 20;
                    const ctrlY = (startY + endY) / 2 - Math.cos(angle) * 20;
                    ctx.quadraticCurveTo(ctrlX, ctrlY, endX, endY);
                    ctx.strokeStyle = '#3e2723';
                    ctx.lineWidth = Math.max(12 - (depth * 3), 3);
                    ctx.lineCap = 'round';
                    ctx.stroke();
                    ctx.restore();

                    if (node.children && node.children.length > 0) {
                        drawNodeShape(endX, endY, node, false);
                        drawBranches(node.children, endX, endY, angle, length * 0.72, depth + 1);
                    } else {
                        drawNodeShape(endX, endY, node, true);
                    }
                });
            }

            function drawNodeShape(x, y, node, isLeaf) {
                const isSelected = selectedNode && selectedNode.id === node.id;
                const radius = 30;

                ctx.save();
                ctx.translate(x, y);

                if (nodeImagesMap[node.id]) {
                    ctx.drawImage(nodeImagesMap[node.id], -radius, -radius, radius * 2, radius * 2);
                    if (isSelected) {
                        ctx.beginPath();
                        ctx.arc(0, 0, radius + 2, 0, Math.PI * 2);
                        ctx.strokeStyle = '#d50000';
                        ctx.lineWidth = 4;
                        ctx.stroke();
                    }
                } else {
                    ctx.beginPath();
                    if (isLeaf) {
                        ctx.moveTo(0, -32);
                        ctx.quadraticCurveTo(25, 0, 0, 32);
                        ctx.quadraticCurveTo(-25, 0, 0, -32);
                    } else {
                        ctx.arc(0, 0, radius, 0, Math.PI * 2);
                    }

                    ctx.fillStyle = isSelected ? '#ffeb3b' : (node.bgColor || '#2e7d32');
                    ctx.fill();
                    ctx.lineWidth = isSelected ? 4 : 2.5;
                    ctx.strokeStyle = isSelected ? '#d50000' : (node.borderColor || '#1b5e20');
                    ctx.stroke();

                    ctx.fillStyle = isSelected ? '#000000' : (node.textColor || '#ffffff');
                    ctx.font = `bold ${node.fontSize || 13}px Tajawal`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(node.name, 0, 0);
                }
                ctx.restore();

                interactiveNodes.push({ x, y, radius, node });
            }

            // رفع صورة الجذع
            document.getElementById('trunkImageUpload').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const removeBg = document.getElementById('removeTrunkBg').checked;
                        processUploadedImage(img, removeBg, (finalImg) => {
                            trunkCustomImage = finalImg;
                            renderAll();
                        });
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });

            // رفع صورة للفرع المحدد
            document.getElementById('nodeImageUpload').addEventListener('change', (e) => {
                if (!selectedNode) { 
                    alert('اختر أولاً اسم أو فرع من الشجرة بالضغط عليه، ثم ارفع الصورة!'); 
                    return; 
                }
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const removeBg = document.getElementById('removeNodeBg').checked;
                        processUploadedImage(img, removeBg, (finalImg) => {
                            nodeImagesMap[selectedNode.id] = finalImg;
                            renderAll();
                        });
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });

            document.getElementById('resetTrunkBtn').addEventListener('click', () => {
                trunkCustomImage = null;
                document.getElementById('trunkImageUpload').value = '';
                renderAll();
            });

            function renderTrunkUI() {
                const container = document.getElementById('trunkListContainer');
                container.innerHTML = '';
                trunkChain.forEach((name, index) => {
                    const div = document.createElement('div');
                    div.className = 'trunk-item';
                    div.innerHTML = `<span>${index + 1}. ${name}</span> <button class="btn-red" data-index="${index}">حذف</button>`;
                    container.appendChild(div);
                });

                container.querySelectorAll('button').forEach(b
